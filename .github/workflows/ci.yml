name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: unjobless_test
          POSTGRES_USER: unjobless
          POSTGRES_PASSWORD: unjobless
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U unjobless -d unjobless_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      UNJOBLESS_TEST_DATABASE_URL: postgresql+psycopg://unjobless:unjobless@127.0.0.1:5433/unjobless_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy
      - name: Migrations have no drift
        run: |
          DATABASE_URL=$UNJOBLESS_TEST_DATABASE_URL uv run alembic upgrade head
          DATABASE_URL=$UNJOBLESS_TEST_DATABASE_URL uv run alembic check
          DATABASE_URL=$UNJOBLESS_TEST_DATABASE_URL uv run alembic downgrade base
      - name: Tests (incl. security, migration, connector contract, evaluation gates)
        run: uv run pytest -p no:warnings --cov=unjobless --cov-report=term-missing:skip-covered
      - name: Signal evaluation report
        run: uv run unjobless eval-signals

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: npm install -g pnpm@11.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:web
      - run: pnpm typecheck:web
      - run: pnpm test:web
      - run: pnpm build:web

  docker:
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: unjobless-app:ci
      - name: Build proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/caddy/Dockerfile
          push: false
          tags: unjobless-proxy:ci
