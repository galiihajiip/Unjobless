[project]
name = "unjobless"
version = "0.1.0"
description = "Unjobless — private AI career discovery and application intelligence (API + worker)"
requires-python = ">=3.13,<3.14"
readme = "README.md"
dependencies = [
  "fastapi>=0.163,<0.164",
  "uvicorn[standard]>=0.54,<0.55",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20,<1.21",
  "psycopg[binary,pool]>=3.3,<3.4",
  "pydantic>=2.14,<2.15",
  "pydantic-settings>=2.16,<2.17",
  "structlog>=26.1",
  "httpx>=0.28,<0.29",
  "dnspython>=2.9,<2.10",
  "cryptography>=50",
  "argon2-cffi>=25.1",
  "python-multipart>=0.0.33",
  "procrastinate>=3.11,<3.12",
  "selectolax>=1.0,<1.1",
  "trafilatura>=2.3,<2.4",
  "pypdf>=7.1,<7.2",
  "python-docx>=1.2,<1.3",
  "rapidfuzz>=3.14,<3.15",
  "anthropic>=2.8,<3",
  "pillow>=11",
  "reportlab>=5.1,<5.2",
]

[dependency-groups]
dev = [
  "pytest>=9.2",
  "pytest-cov>=6",
  "ruff>=0.17",
  "mypy>=2.4",
]

[project.scripts]
unjobless = "unjobless.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unjobless"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF012", "B008", "S311", "E501", "RUF001", "RUF002", "RUF005", "SIM102", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
packages = ["unjobless"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
markers = [
  "db: requires the PostgreSQL test database",
]
filterwarnings = ["ignore::DeprecationWarning:trafilatura.*"]
