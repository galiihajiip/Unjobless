# Development-only services. App processes run natively with hot reload.
# Usage: docker compose -f compose.dev.yaml up -d
name: unjobless-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: unjobless
      POSTGRES_USER: unjobless
      POSTGRES_PASSWORD: unjobless   # dev-only credential, bound to localhost
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - devpgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unjobless -d unjobless"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  devpgdata:
