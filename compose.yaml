# Unjobless — full stack. Usage:
#   cp .env.example .env      # fill in the secrets
#   docker compose up -d --build
name: unjobless

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-app: &app
  build:
    context: ./backend
  image: unjobless-app:${UNJOBLESS_VERSION:-local}
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-unjobless}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-unjobless}
    FORWARDED_ALLOW_IPS: "*"   # the API port is not published; only the proxy can reach it
  volumes:
    - files:/data/files
    - backups:/data/backups
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp"]

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unjobless}
      POSTGRES_USER: ${POSTGRES_USER:-unjobless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    shm_size: 128mb
    deploy:
      resources:
        limits: { memory: 768m }
    logging: *logging

  migrate:
    <<: *app
    command: ["unjobless", "migrate"]
    restart: "no"
    networks: [data]
    healthcheck:
      disable: true
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *app
    command: ["unjobless", "serve", "--host", "0.0.0.0", "--port", "8000"]
    networks: [data, edge]
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: 768m }

  worker:
    <<: *app
    command: ["unjobless", "worker"]
    networks: [data, egress]
    healthcheck:
      disable: true
    stop_grace_period: 75s
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: 1536m }

  proxy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    image: unjobless-proxy:${UNJOBLESS_VERSION:-local}
    environment:
      UNJOBLESS_DOMAIN: ${UNJOBLESS_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

networks:
  data:
    internal: true   # database network: no internet route; the proxy is not attached
  edge: {}           # proxy <-> api (the api also needs egress to reach AI providers)
  egress: {}         # worker internet access for permitted collection

volumes:
  pgdata:
  files:
  backups:
  caddy_data:
  caddy_config:
